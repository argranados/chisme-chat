name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run tests
        run: mvn clean test

      - name: Package JAR
        run: mvn package -DskipTests=false

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2   # ajusta a tu región

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: chisme-chat
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # aqui se agrego configuracion para EB
      - name: Generate Dockerrun.aws.json
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: chisme-chat
          IMAGE_TAG:  ${{ github.sha }}
        run: |
          echo '{
              "AWSEBDockerrunVersion": "1",
              "Image": {
                "Name": "'$ECR_REGISTRY'/'$ECR_REPOSITORY':'$IMAGE_TAG'",
                "Update": "true"
              },
              "Ports": [
                { "ContainerPort": "8080" }
              ]
            }' > Dockerrun.aws.json
            cat Dockerrun.aws.json

      - name: Upload Dockerrun artifact
        uses: actions/upload-artifact@v4
        with:
          name: dockerrun 
          path: Dockerrun.aws.json 
          retention-days: 1

  deploy-eb: 
    runs-on: ubuntu-latest 
    needs: docker-build-push
    steps: 
      - name: Checkout repo 
        uses: actions/checkout@v3

      - name: Download Dockerrun artifact 
        uses: actions/download-artifact@v4 
        with: 
          name: dockerrun 
          path: .

      - name: Configure AWS credentials 
        uses: aws-actions/configure-aws-credentials@v3 
        with: 
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }} 
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }} 
          aws-region: us-east-2 # ajusta a tu región

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: chisme-chat
          environment_name: chisme-chat-env
          version_label: ${{ github.sha }}-${{ github.run_id }}
          region: us-east-2
          deployment_package: Dockerrun.aws.json
          use_existing_version_if_available: true